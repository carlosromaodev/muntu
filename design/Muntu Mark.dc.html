<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg viewBox="0 0 100 100" width="{{ size }}" height="{{ size }}" style="display:block;flex-shrink:0" aria-label="Símbolo MUNTU">
<circle cx="50" cy="50" r="{{ ringR }}" fill="none" stroke="{{ color }}" stroke-width="{{ ringW }}"></circle>
<sc-for list="{{ lines }}" as="l" hint-placeholder-count="12">
<line x1="{{ l.x1 }}" y1="{{ l.y1 }}" x2="{{ l.x2 }}" y2="{{ l.y2 }}" stroke="{{ color }}" stroke-width="{{ l.w }}" stroke-linecap="round"></line>
</sc-for>
<sc-for list="{{ dots }}" as="d" hint-placeholder-count="0">
<circle cx="{{ d.cx }}" cy="{{ d.cy }}" r="{{ d.r }}" fill="{{ color }}"></circle>
</sc-for>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:200},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;A&quot;,&quot;B&quot;,&quot;C&quot;],&quot;default&quot;:&quot;A&quot;,&quot;tsType&quot;:&quot;'A'|'B'|'C'&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#c8640c&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:64,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? "A";
    const P = (a, r) => [50 + r * Math.cos(a), 50 + r * Math.sin(a)];
    const L = (a1, r1, a2, r2, w) => { const [x1, y1] = P(a1, r1), [x2, y2] = P(a2, r2); return { x1, y1, x2, y2, w }; };
    const lines = [], dots = [];
    let ringR = 18, ringW = 8;
    if (v === "A") {
      for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6 - Math.PI / 2; lines.push(L(a, 30, a, 45, 7)); }
    } else if (v === "B") {
      for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2; lines.push(L(a, 30, a, 36, 7)); const [cx, cy] = P(a, 44); dots.push({ cx, cy, r: 5 }); }
    } else {
      ringR = 17;
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4 - Math.PI / 2;
        lines.push(L(a, 28, a, 38, 7));
        const [bx, by] = P(a, 38);
        [-0.6, 0.6].forEach(o => lines.push({ x1: bx, y1: by, x2: bx + 9 * Math.cos(a + o), y2: by + 9 * Math.sin(a + o), w: 6 }));
      }
    }
    return { lines, dots, ringR, ringW, color: this.props.color ?? "#c8640c", size: this.props.size ?? 64 };
  }
}
</script>
</body>
</html>
