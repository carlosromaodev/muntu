<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</helmet>
<div style="display:flex;flex-direction:{{ dir }};align-items:center;gap:{{ gap }}px;color:{{ color }}">
<dc-import name="Muntu Mark" variant="{{ variant }}" color="{{ color }}" size="{{ markSize }}" hint-size="48px,48px"></dc-import>
<div style="display:flex;flex-direction:column;align-items:{{ align }};gap:{{ tagGap }}px">
<span style="font-family:Outfit,sans-serif;font-weight:500;font-size:{{ wordSize }}px;line-height:.82;letter-spacing:.02em">MUNTU</span>
<sc-if value="{{ tagline }}">
<span style="font-family:Outfit,sans-serif;font-weight:500;font-size:{{ tagSize }}px;letter-spacing:.24em;text-transform:uppercase;white-space:nowrap;opacity:.8">{{ taglineText }}</span>
</sc-if>
</div>
<sc-if value="{{ descriptor }}">
<span style="align-self:{{ descAlign }};margin-top:{{ descTop }}px;font-family:Outfit,sans-serif;font-weight:600;font-size:{{ descSize }}px;line-height:1;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;padding:{{ padY }}px {{ padR }}px {{ padY }}px {{ padL }}px;border-radius:2px;background:{{ descColor }};color:{{ descInk }}">{{ descriptor }}</span>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:160},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;A&quot;,&quot;B&quot;,&quot;C&quot;],&quot;default&quot;:&quot;A&quot;,&quot;tsType&quot;:&quot;'A'|'B'|'C'&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1d1c1a&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:48,&quot;tsType&quot;:&quot;number&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;horizontal&quot;,&quot;vertical&quot;],&quot;default&quot;:&quot;horizontal&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tagline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;descriptor&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;descriptorColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#8a867d&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;descriptorInk&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#fbfaf7&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.size ?? 48, vert = this.props.layout === "vertical";
    return {
      variant: this.props.variant ?? "A", color: this.props.color ?? "#1d1c1a", tagline: !!this.props.tagline, taglineText: this.props.taglineText ?? "Gestão de ginásios",
      dir: vert ? "column" : "row", align: vert ? "center" : "flex-start",
      markSize: vert ? s * 1.5 : s, gap: vert ? s * 0.4 : s * 0.24,
      descriptor: this.props.descriptor ?? "", descColor: this.props.descriptorColor ?? "#8a867d", descInk: this.props.descriptorInk ?? "#fbfaf7",
      descAlign: vert ? "center" : "flex-start", descTop: vert ? 0 : s * 0.12, descSize: Math.max(9, s * 0.2),
      padY: Math.max(4, s * 0.09), padL: Math.max(7, s * 0.15), padR: Math.max(5, s * 0.12),
      wordSize: s * 0.72, tagSize: Math.max(9, s * 0.15), tagGap: s * 0.16
    };
  }
}
</script>
</body>
</html>
