<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</helmet>
<div style="position:relative;width:{{ size }}px;height:{{ size }}px;flex-shrink:0">
<svg viewBox="0 0 200 200" width="{{ size }}" height="{{ size }}" style="display:block" aria-label="Selo MUNTU Ginásio">
<defs><path id="{{ pid }}" d="M100,26 a74,74 0 1,1 -0.01,0"></path></defs>
<circle cx="100" cy="100" r="96" fill="none" stroke="{{ gray }}" stroke-width="1"></circle>
<circle cx="100" cy="100" r="56" fill="none" stroke="{{ gray }}" stroke-width="1"></circle>
<text font-family="Outfit,sans-serif" font-size="15" font-weight="500" letter-spacing="3"><textPath href="{{ pref }}" textLength="458" lengthAdjust="spacing"><tspan fill="{{ color }}">MUNTU</tspan><tspan fill="{{ gray }}" font-weight="400"> · GINÁSIO · </tspan><tspan fill="{{ color }}">MUNTU</tspan><tspan fill="{{ gray }}" font-weight="400"> · GINÁSIO ·</tspan></textPath></text>
</svg>
<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><dc-import name="Muntu Mark" variant="C" color="{{ markColor }}" size="{{ markSize }}" hint-size="64px,64px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:220},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:180,&quot;tsType&quot;:&quot;number&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1d1c1a&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;grayColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#8a867d&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;markColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1d1c1a&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  pid = "seal-" + Math.random().toString(36).slice(2, 8);
  renderVals() {
    const size = this.props.size ?? 180, color = this.props.color ?? "#1d1c1a";
    return { size, color, gray: this.props.grayColor ?? "#8a867d", markColor: this.props.markColor ?? color, markSize: Math.round(size * 0.355), pid: this.pid, pref: "#" + this.pid };
  }
}
</script>
</body>
</html>
